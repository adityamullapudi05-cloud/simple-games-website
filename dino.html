<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Run - Arcade Hub 🕹️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- STANDARD HEADER -->
    <header>
        <div class="header-content">
            <h1><a href="home.html">🎮 Arcade Hub</a></h1>
            <nav>
                <a href="home.html" class="nav-link active">All Games</a>
            </nav>
        </div>
        <div class="auth-buttons">
            <!-- Auth buttons dynamically loaded by script.js -->
        </div>
    </header>

    <!-- MAIN CONTENT / GAME WRAPPER -->
    <div class="container">
        <div class="game-wrapper">
            <h2>Dino Run 🦖</h2>
            <div id="dino-game">
                <!-- Dino will be drawn here by JS using .dino-pixel divs -->
                <div id="dino"></div> 
                <div id="obstacle"></div>
            </div>
            <div id="dino-score">Score: 0</div>
            <p class="instruction">Press Spacebar or Tap to Jump/Start!</p>
            <button class="btn" id="dino-restart-btn" style="display:none;">Play Again</button>
        </div>
    </div>

    <!-- ACCOUNT MODAL (POPUP) -->
    <div id="accountModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title"></h3>
            <form onsubmit="handleAccount(event)">
                <label for="modal_username"><b>Username</b></label>
                <input type="text" id="modal_username" placeholder="Enter Username" name="modal_username" required>
                <label for="modal_psw"><b>Password</b></label>
                <input type="password" id="modal_psw" placeholder="Enter Password" name="modal_psw" required>
                <button type="submit" id="modal-submit-btn" class="btn"></button>
            </form>
            <small>*Note: This is a frontend demo. No data is stored.*</small>
        </div>
    </div>

    <!-- STANDARD FOOTER -->
    <footer>
        <div class="theme-switcher">
            <span>Theme:</span>
            <button class="btn btn-theme" onclick="setTheme('light')">Light</button>
            <button class="btn btn-theme" onclick="setTheme('dark')">Dark</button>
            <button class="btn btn-theme" onclick="setTheme('extra-dark')">Extra Dark</button>
        </div>
        <p>&copy; 2025 Arcade Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
