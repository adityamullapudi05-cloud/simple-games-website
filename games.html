<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More Games - Arcade Hub 🕹️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <h1><a href="index.html">🎮 Arcade Hub</a></h1>
            <nav>
                <a href="index.html" class="nav-link">Home</a>
                <a href="games.html" class="nav-link active">More Games</a>
            </nav>
        </div>
        <div class="auth-buttons">
            <button onclick="openModal('login')">Login</button>
            <button onclick="openModal('signup')">Sign Up</button>
        </div>
    </header>

    <div class="container">
        <h2>Full Game Library</h2>
        
        <div class="game-grid">
            
            <div class="game-card">
                <h3>Whac-A-Mole! 🔨</h3>
                <div class="wam-container">
                    <h2 id="wam-score">Score: 0</h2>
                    <div id="wam-grid">
                        </div>
                    <button class="btn" id="wam-start-btn">Start Game</button>
                </div>
            </div>

            <div class="game-card">
                <h3>Cookie Clicker 🍪</h3>
                <div class="cookie-container">
                    <h2 id="cookie-score">0 Cookies</h2>
                    <p id="cookie-cps">per second: 0</p>
                    <div id="cookie-clicker">
                        <img src="https://assets.stickpng.com/images/580b57fbd9996e24bc43c0f6.png" alt="Cookie" id="cookie-img">
                    </div>
                    <div id="cookie-upgrades">
                        <button class="btn" id="upgrade-auto-clicker">Auto-Clicker (Cost: 15)</button>
                    </div>
                </div>
            </div>

            </div>
    </div>

    <div id="accountModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modal-title"></h3>
            <p>User accounts will store your high scores and progress!</p>
            <form onsubmit="handleAccount(event)">
                <label for="username"><b>Username</b></label>
                <input type="text" placeholder="Enter Username" name="username" required>
                <label for="psw"><b>Password</b></label>
                <input type="password" placeholder="Enter Password" name="psw" required>
                <button type="submit" id="modal-submit-btn" class="btn"></button>
            </form>
            <small>*Note: This is a frontend demo. No data is stored.*</small>
        </div>
    </div>

    <footer>
        <div class="theme-switcher">
            <span>Theme:</span>
            <button class="btn btn-theme" onclick="setTheme('light')">Light</button>
            <button class="btn btn-theme" onclick="setTheme('dark')">Dark</button>
            <button class="btn btn-theme" onclick="setTheme('extra-dark')">Extra Dark</button>
        </div>
        <p>&copy; 2025 Arcade Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
