<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Arcade Hub 🕹️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">

    <div class="login-container">
        <div class="login-card">
            <h1>🎮 Arcade Hub</h1>
            <p>Login to save your high scores or continue as a guest.</p>
            
            <form id="login-form">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                
                <button type="submit" class="btn btn-login">Login</button>
            </form>
            
            <a href="home.html" class="guest-link">Continue as Guest &rarr;</a>
        </div>
        
        <div class="theme-switcher-login">
            <span>Theme:</span>
            <button class="btn btn-theme" onclick="setTheme('light')">Light</button>
            <button class="btn btn-theme" onclick="setTheme('dark')">Dark</button>
            <button class="btn btn-theme" onclick="setTheme('extra-dark')">Extra Dark</button>
        </div>
    </div>

    <script>
        // Theme switcher logic, duplicated here so it works on the login page
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
        window.setTheme = function(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        // Mock login
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Login successful! (Demo)\n\nIn a real app, you would be redirected.');
            // Redirect to the home page after "logging in"
            window.location.href = 'home.html';
        });
    </script>
</body>
</html>
